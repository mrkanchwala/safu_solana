[package]
name = "safu_pool"
version = "0.1.0"
description = "SAFU Staking on Solana: SOL protection pool, staked through Marinade"
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "safu_pool"

[features]
default = []
# Fast devnet clocks. One switch: forwarded to pool-core, where every clock value lives.
demo = ["pool-core/demo"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token"] }
# Exact pin: a pool-core change is adopted here on purpose, never picked up silently.
pool-core = { path = "../../crates/pool-core", version = "=0.1.0" }
# Same versions as the vetted safucredit lockfile (transitive via anchor-lang).
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
# sha256 syscall on-chain; `sha2` backs it in host tests.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.4.0"
spl-token-interface = "=2.0.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
serde_json = "1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
