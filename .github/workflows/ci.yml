# CI: every check the program is released with, on every push and pull request.
#   program: fmt, the SBF build (devnet demo build and normal build), clippy and the LiteSVM + property
#            suites against each build, and the one-source check for addresses and rule numbers
#   program also builds the IDL and hands it to the app job
#   app:     lint and unit tests for the site, run against that IDL
#   audit:   dependency advisories, with the known ones proven to reach only the test harness or
#            the host build (the host-only proof runs in the program job, against the SBF target)
# `--locked` everywhere: a stale Cargo.lock fails instead of resolving something untested.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  program:
    name: program (SBF + LiteSVM, both builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Official Anza installer, pinned to the version the program is built and deployed with.
      - name: Install Solana CLI 3.1.10
        run: |
          curl -sSfL https://release.anza.xyz/v3.1.10/install -o solana-install.sh
          sh solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Toolchain in use
        run: rustc --version && solana --version && cargo build-sbf --version

      - name: Format
        run: cargo fmt --check

      - name: One source for addresses and rule numbers
        run: bash scripts/check_no_hardcodes.sh

      # The devnet program is the demo build (fast clocks). The tests embed the built program,
      # so each build is followed by its own test and clippy run.
      - name: Build (demo)
        run: cargo build-sbf --manifest-path programs/safu_pool/Cargo.toml --features demo -- --locked

      - name: Program is not empty (demo)
        run: test "$(stat -c %s target/deploy/safu_pool.so)" -gt 100000

      - name: Clippy (demo)
        run: cargo clippy --all-targets --locked --features demo -p safu_pool -p pool-core -- -D warnings

      - name: Tests (demo)
        run: cargo test --locked --features demo -p safu_pool -p pool-core

      - name: Build (normal)
        run: cargo build-sbf --manifest-path programs/safu_pool/Cargo.toml -- --locked

      - name: Program is not empty (normal)
        run: test "$(stat -c %s target/deploy/safu_pool.so)" -gt 100000

      # RUSTSEC-2026-0387 (crypto-bigint 0.5.5) comes in through k256, which solana-secp256k1-recover
      # pulls only off-chain, and the test harness. Ignored in the audit job; proven here on every
      # run against the on-chain target, so the ignore cannot outlive it.
      - name: Host-only advisories stay out of the on-chain program
        run: |
          rustc_sbf=$(ls -d "$HOME"/.cache/solana/*/platform-tools/rust/bin/rustc | head -n 1)
          test -x "$rustc_sbf"
          tree=$(RUSTC="$rustc_sbf" cargo tree --locked -e normal --target sbpf-solana-solana \
            --manifest-path programs/safu_pool/Cargo.toml)
          echo "$tree" | grep -q "^safu_pool" || { echo "::error::SBF dependency tree did not resolve"; exit 1; }
          for c in crypto-bigint@0.5.5; do
            out=$(RUSTC="$rustc_sbf" cargo tree --locked -e normal --target sbpf-solana-solana \
              --manifest-path programs/safu_pool/Cargo.toml -i "$c" 2>&1 || true)
            if [ -n "$out" ] && ! echo "$out" | grep -q -e "nothing to print" -e "did not match any packages"; then
              echo "::error::$c is in the on-chain program's dependency tree"; echo "$out"; exit 1
            fi
            echo "$c: not on-chain"
          done

      - name: Clippy (normal)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (normal)
        run: cargo test --locked

      # The site reads the program's IDL at build and test time. The CLI version is read from
      # Cargo.lock so it always matches the anchor-lang the program is built with.
      - name: Anchor CLI version
        id: anchor
        run: echo "version=$(grep -A1 '^name = "anchor-lang"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ steps.anchor.outputs.version }}-${{ runner.os }}

      - name: Install Anchor CLI ${{ steps.anchor.outputs.version }}
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version "${{ steps.anchor.outputs.version }}" --locked

      - name: IDL
        run: |
          anchor --version
          mkdir -p target/idl
          anchor idl build -p safu_pool -o target/idl/safu_pool.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safu-pool-idl
          path: target/idl/safu_pool.json
          if-no-files-found: error

  app:
    name: site (lint + unit tests)
    needs: program
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The IDL built by the program job, at the path vite.config.ts and vitest.config.ts read.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: safu-pool-idl
          path: target/idl

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Unit tests
        run: npx vitest run

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked

      # RUSTSEC-2024-0344 (curve25519-dalek 3.2.0) and RUSTSEC-2022-0093 (ed25519-dalek 1.0.1) come in
      # through litesvm, the test harness. Proven here on every run, so the ignore cannot outlive it.
      - name: Known advisories reach only dev-dependencies
        run: |
          for c in curve25519-dalek@3.2.0 ed25519-dalek@1.0.1; do
            out=$(cargo tree --locked -e normal -i "$c" 2>&1 || true)
            if [ -n "$out" ] && ! echo "$out" | grep -q -e "nothing to print" -e "did not match any packages"; then
              echo "::error::$c is in the program's normal dependency tree"; echo "$out"; exit 1
            fi
            echo "$c: dev-only"
          done

      # RUSTSEC-2026-0387: host build and test harness only, proven in the program job.
      - name: Audit
        run: cargo audit --ignore RUSTSEC-2024-0344 --ignore RUSTSEC-2022-0093 --ignore RUSTSEC-2026-0387

      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Licenses, sources and advisories (deny.toml)
        run: cargo deny --locked check
